[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curie-infusion"
version = "0.1.0"
description = "FHIR-native infusion dose ledger and deterministic 'what not to infuse' safety engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
app = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
curie-infusion = "curie_infusion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/curie_infusion"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--cov=curie_infusion --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/curie_infusion"]
