<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curie Infusion</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <h1>Curie Infusion</h1>
  <nav class="pages"><a href="/" class="on" id="nav-infusions">Infusions</a><a href="/billing" id="nav-billing">Billing</a></nav>
  <span class="note">MIMIC-IV 3.1 replay · research prototype · illustrative rules · not for patient care</span>
</header>
<div class="layout">
  <aside>
    <input id="q" placeholder="Search stay or subject id" autocomplete="off">
    <div id="stays"></div>
  </aside>
  <main>
    <div class="banner" id="banner"><span class="muted">Select an ICU stay.</span></div>
    <nav class="datatabs" id="datatabs" hidden>
      <button data-tab="timeline" class="on">Infusions &amp; vitals</button>
      <button data-tab="fluids">Fluid balance</button>
      <button data-tab="labs">Labs</button>
      <button data-tab="assessments">Assessments</button>
      <button data-tab="nutrition">Nutrition</button>
      <button data-tab="orders">Orders</button>
      <button data-tab="emar">eMAR</button>
      <button data-tab="micro">Microbiology</button>
      <button data-tab="procedures">Lines &amp; procedures</button>
      <button data-tab="journey">Journey &amp; diagnoses</button>
    </nav>
    <div class="controls" id="controls" hidden>
      <div class="tabs" id="grains">
        <button data-grain="hour" class="on">Hourly</button>
        <button data-grain="day">Daily</button>
        <button data-grain="week">Weekly</button>
      </div>
      <span class="muted" style="margin-left:8px">Pump clock</span>
      <button id="back" title="Back 1 hour">−1h</button>
      <input type="datetime-local" id="clock" step="60">
      <button id="fwd" title="Forward 1 hour">+1h</button>
      <button id="play" title="Advance 1 hour every 2 seconds">▶ Replay</button>
    </div>
    <p class="tabnote" id="tabnote" hidden></p>
    <div class="gridwrap" id="gridwrap" hidden><table id="grid"></table></div>
    <div id="tablewrap" hidden></div>
  </main>
  <section class="safety" id="safety">
    <p class="empty">Current-hour safety appears here.</p>
  </section>
</div>
<dialog id="detail" aria-labelledby="d-title"></dialog>
<script>
const $ = (s) => document.querySelector(s);
const state = { stay: null, grain: "hour", clock: null, timer: null, req: 0, sel: null, tab: "timeline", filter: "", hindsight: false, table: null };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const iso = (d) => d.toISOString().slice(0, 16);   // naive UTC minutes, the MIMIC convention
const parse = (s) => new Date(s.slice(0, 16) + "Z");
const fmt = (v) => v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v >= 0.01 ? v.toFixed(2) : v.toExponential(1);
const api = async (path) => { const r = await fetch(path); if (!r.ok) throw new Error(await r.text()); return r.json(); };

async function loadStays(q = "") {
  const stays = await api(`/api/stays?limit=100${q ? `&q=${encodeURIComponent(q)}` : ""}`);
  $("#stays").innerHTML = stays.map((s) => `
    <div class="stay${state.stay?.stay_id === s.stay_id ? " sel" : ""}" data-id="${s.stay_id}">
      <b>${s.stay_id}</b> <span class="muted">· ${s.subject_id}</span>
      <small>${esc(s.first_careunit)} · ${s.los.toFixed(1)} d · ${s.n_infusion_rows} rows</small>
    </div>`).join("") || `<p class="empty">No stays.</p>`;
}

async function selectStay(id) {
  state.stay = await api(`/api/stays/${id}`);
  history.replaceState(null, "", `?stay=${id}${state.tab !== "timeline" ? `&tab=${state.tab}` : ""}`);
  $("#nav-billing").href = `/billing?stay=${id}`;
  const s = state.stay;
  state.clock = new Date(Math.min(parse(s.outtime), +parse(s.intime) + 12 * 3600e3));
  $("#banner").innerHTML = `<b>Stay ${s.stay_id}</b>
    <span>Subject ${s.subject_id} · ${s.gender}, ${s.anchor_age} y</span>
    <span>${esc(s.first_careunit)}</span>
    <span class="muted">${s.intime.replace("T", " ").slice(0, 16)} → ${s.outtime.replace("T", " ").slice(0, 16)} (${s.los.toFixed(1)} d)</span>`;
  $("#controls").hidden = false;
  $("#datatabs").hidden = false;
  document.querySelectorAll(".stay").forEach((el) => el.classList.toggle("sel", +el.dataset.id === s.stay_id));
  refresh();
}

function setClock(d) {
  const s = state.stay;
  state.clock = new Date(Math.max(parse(s.intime), Math.min(parse(s.outtime), d)));
  refresh();
}

async function refresh() {
  const req = ++state.req;
  $("#clock").value = iso(state.clock);
  const q = `as_of=${iso(state.clock)}`;
  const id = state.stay.stay_id;
  const view = state.tab === "timeline" ? `/api/stays/${id}/grid?grain=${state.grain}&${q}`
    : `/api/stays/${id}/tabs/${state.tab}?grain=${state.grain}&${q}${state.hindsight ? "&hindsight=true" : ""}`;
  const [data, safety] = await Promise.all([
    api(view).catch((e) => ({ error: String(e.message || e) })),
    api(`/api/stays/${id}/safety?${q}`),
  ]);
  if (req !== state.req) return;   // a newer clock position won
  renderView(data);
  renderSafety(safety);
  const ai = await api(`/api/stays/${id}/summary?${q}`).catch((e) => ({ text: String(e), source: "error" }));
  if (req === state.req) renderSummary(ai);
}

function bucketLabel(b, grain) {
  const d = parse(b);
  if (grain === "hour") return `${String(d.getUTCHours()).padStart(2, "0")}:00`;
  const md = `${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
  return grain === "day" ? md : `wk ${md}`;
}

function renderView(data) {
  const isTable = data.kind === "table";
  $("#grains").hidden = isTable;
  $("#gridwrap").hidden = isTable || !!data.error;
  $("#tablewrap").hidden = !isTable && !data.error;
  $("#tabnote").hidden = !data.note;
  $("#tabnote").textContent = data.note || "";
  if (data.error) { $("#tablewrap").innerHTML = `<p class="empty">${esc(data.error)}</p>`; return; }
  if (state.tab === "timeline") return renderGrid(data);
  if (data.kind === "series") return renderSeries(data);
  state.table = data;
  renderTable();
}

const signed = (v) => v === 0 ? "0" : v < 0 ? `−${fmt(-v)}` : fmt(v);
const cellText = (c) => c.text != null ? c.text : c.v == null ? "" : signed(c.v);

function renderSeries(d) {
  const nowBucket = d.buckets[d.buckets.length - 1];
  const hasTotal = d.groups.some((g) => g.rows.some((r) => r.total != null));
  let body = "";
  for (const g of d.groups) {
    body += `<tr class="cat"><td class="drug">${esc(g.name)}</td><td colspan="${d.buckets.length + 1}"></td></tr>`;
    for (const r of g.rows) {
      body += `<tr><td class="drug">${esc(r.label)}<small>${esc(r.unit)}</small></td>${d.buckets.map((b) => {
        const c = r.cells[b];
        const now = b === nowBucket ? "now" : "";
        if (!c) return `<td class="${now}"></td>`;
        return `<td class="${now} vt${c.flag ? " ab" : ""}" tabindex="0" role="button" data-key="${esc(r.key)}" data-bucket="${b}"
          title="${esc(`${r.label}: ${c.tip || ""} · click for details`)}">${esc(cellText(c))}</td>`;
      }).join("")}<td>${r.total != null ? `<b>${esc(cellText({ v: r.total }))}</b>` : ""}</td></tr>`;
    }
  }
  if (!d.groups.length) body = `<tr><td class="drug empty" colspan="${d.buckets.length + 2}">Nothing charted in this window.</td></tr>`;
  $("#grid").innerHTML = `<thead><tr><th class="drug">Item (unit)</th>${d.buckets.map((b) =>
    `<th class="${b === nowBucket ? "now" : ""}" title="${b}">${bucketLabel(b, state.grain)}</th>`).join("")}<th>${hasTotal ? "Total" : ""}</th></tr></thead><tbody>${body}</tbody>`;
  const wrap = $("#gridwrap");
  wrap.scrollLeft = wrap.scrollWidth;
}

const show = (v) => v == null || v === "" ? "" : typeof v === "string" && /^\d{4}-\d\d-\d\dT/.test(v) ? when(v) : String(v);
const STATUS_CLASS = { active: "st-on", ongoing: "st-on", pending: "st-wait", scheduled: "st-wait", stopped: "st-off", resulted: "st-off" };

function renderTable() {
  const d = state.table;
  const f = state.filter.toLowerCase();
  const rows = d.rows.map((r, i) => ({ r, i })).filter(({ r }) => !f || Object.values(r).some((v) => String(v ?? "").toLowerCase().includes(f)));
  const LIMIT = 400;
  const statusKey = d.columns.find((c) => c.key.startsWith("status"))?.key;
  let html = `<div class="tabletools"><input id="tfilter" placeholder="Filter ${d.rows.length} rows…" value="${esc(state.filter)}" autocomplete="off">
    <span class="muted">${rows.length} shown${rows.length > LIMIT ? ` (first ${LIMIT})` : ""} · click a row for every field</span></div>`;
  if (d.tab === "journey") html = journeyHeader(d) + html;
  html += `<div class="gridwrap"><table class="list dt"><thead><tr>${d.columns.map((c) => `<th class="l">${esc(c.label)}</th>`).join("")}</tr></thead><tbody>${
    rows.slice(0, LIMIT).map(({ r, i }) => `<tr data-i="${i}" tabindex="0">${d.columns.map((c) => {
      const v = show(r[c.key]);
      return c.key === statusKey ? `<td class="l"><span class="st ${STATUS_CLASS[v] || ""}">${esc(v)}</span></td>` : `<td class="l">${esc(v)}</td>`;
    }).join("")}</tr>`).join("") || `<tr><td class="l empty" colspan="${d.columns.length}">${d.rows.length ? "No rows match the filter." : emptyText(d.tab)}</td></tr>`
  }</tbody></table></div>`;
  if (d.tab === "journey") html += codingSection(d);
  $("#tablewrap").innerHTML = html;
  const input = $("#tfilter");
  input.oninput = (e) => { state.filter = e.target.value; const pos = e.target.selectionStart; renderTable(); const n = $("#tfilter"); n.focus(); n.setSelectionRange(pos, pos); };
  $("#tablewrap").querySelector("tbody").onclick = (e) => { const tr = e.target.closest("tr[data-i]"); if (tr) openRow(d.rows[+tr.dataset.i], d.columns); };
  $("#hindsight")?.addEventListener("click", () => { state.hindsight = !state.hindsight; refresh(); });
}

const emptyText = (tab) => ({ emar: "No eMAR records for this admission by the clock (eMAR scanning is not present for every MIMIC admission).",
  micro: "No specimens collected by the clock.", orders: "No pharmacy orders entered by the clock." }[tab] || "Nothing recorded by the clock.");

function journeyHeader(d) {
  const a = d.admission || {};
  const kv = [["Admitted", show(a.admittime)], ["Type", a.admission_type], ["From", a.admission_location], ["Insurance", a.insurance],
    ["Language", a.language], ["ED", a.edregtime ? `${show(a.edregtime)} → ${show(a.edouttime)}` : ""],
    ["Discharged", a.dischtime ? show(a.dischtime) : "not yet (at the clock)"], ["Discharged to", a.discharge_location],
    ["Died in hospital", a.hospital_expire_flag == null ? "" : a.hospital_expire_flag ? "yes" : "no"]];
  return `<div class="kv">${kv.filter(([, v]) => v).map(([k, v]) => `<div><span class="muted">${k}</span><b>${esc(v)}</b></div>`).join("")}</div>`;
}

function codingSection(d) {
  const toggle = `<button id="hindsight" class="${state.hindsight ? "on" : ""}" title="Show codes that were only assigned at discharge">${state.hindsight ? "Hide" : "Show"} discharge coding (hindsight)</button>`;
  if (d.coding_hidden) return `<h3 class="sub">Diagnoses, procedures &amp; DRG ${toggle}</h3><p class="empty">Coded at discharge (${esc(show(d.dischtime))}); hidden at this clock.</p>`;
  const rows = d.coding.map((c) => `<tr><td class="l">${esc(c.kind)}</td><td class="l">${c.seq ?? ""}</td><td class="l"><code>${esc(c.code)}</code></td><td class="l">${esc(c.title)}</td><td class="l">${esc(show(c.date))}</td></tr>`).join("");
  return `<h3 class="sub">Diagnoses, procedures &amp; DRG ${d.dischtime && parse(String(d.dischtime)) > state.clock ? toggle : ""}</h3>
    <div class="gridwrap"><table class="list dt"><thead><tr><th class="l">Kind</th><th class="l">#</th><th class="l">Code</th><th class="l">Title</th><th class="l">Date</th></tr></thead><tbody>${rows || '<tr><td class="l empty" colspan="5">None coded.</td></tr>'}</tbody></table></div>`;
}

function openRow(r, columns) {
  const dlg = $("#detail");
  const main = columns.map((c) => c.key);
  const keys = [...main, ...Object.keys(r).filter((k) => !main.includes(k))];
  dlg.innerHTML = `<div class="d-head"><div class="row" style="margin-top:0"><span class="muted">${esc($("#datatabs .on").textContent)}</span><button id="d-close" aria-label="Close">✕</button></div>
      <h3 id="d-title">${esc(r.medication || r.procedure || r.test || r.what || r.event || "Details")}</h3></div>
    <div class="d-body"><dl class="fields">${keys.map((k) => `<dt>${esc(k.replaceAll("_", " "))}</dt><dd>${esc(show(r[k])) || '<span class="muted">—</span>'}</dd>`).join("")}</dl></div>`;
  $("#d-close").onclick = () => dlg.close();
  if (!dlg.open) dlg.showModal();
}

async function openSeriesCell(key, bucket) {
  markSelected({ series: key, bucket });
  const dlg = $("#detail");
  dlg.innerHTML = `<div class="d-body"><p class="empty">Loading…</p></div>`;
  if (!dlg.open) dlg.showModal();
  const q = new URLSearchParams({ key, bucket, grain: state.grain, as_of: iso(state.clock) });
  const d = await api(`/api/stays/${state.stay.stay_id}/tabs/${state.tab}/cell?${q}`);
  const label = document.querySelector(`td.vt[data-key="${CSS.escape(key)}"]`)?.closest("tr").querySelector("td.drug").firstChild.textContent ?? key;
  dlg.innerHTML = `<div class="d-head"><div class="row" style="margin-top:0"><span class="muted">${esc($("#datatabs .on").textContent)}</span><button id="d-close" aria-label="Close">✕</button></div>
      <h3 id="d-title">${esc(label)}</h3><div class="muted">${bucketLabel(bucket, state.grain)} · ${d.rows.length} record(s)</div></div>
    <div class="d-body"><table class="readings"><thead><tr>${d.columns.map((c) => `<th class="l">${esc(c.label)}</th>`).join("")}</tr></thead>
      <tbody>${d.rows.map((r) => `<tr>${d.columns.map((c) => `<td class="l">${esc(show(r[c.key]))}</td>`).join("")}</tr>`).join("") || '<tr><td class="l empty">No records.</td></tr>'}</tbody></table></div>`;
  $("#d-close").onclick = () => dlg.close();
}

const vfmt = (vital, v) => v == null ? "" : vital === "temp" ? v.toFixed(1) : Math.round(v).toString();

function renderGrid(g) {
  const nowBucket = g.buckets[g.buckets.length - 1];
  const head = `<thead><tr><th class="drug">Vital / medication / fluid (unit)</th>${g.buckets.map((b) =>
    `<th class="${b === nowBucket ? "now" : ""}" title="${b}">${bucketLabel(b, g.grain)}</th>`).join("")}<th>Total</th></tr></thead>`;
  let body = "", cat = null;
  if (g.vitals.length) {
    body += `<tr class="cat"><td class="drug">Vital signs</td><td colspan="${g.buckets.length + 1}"></td></tr>`;
    for (const v of g.vitals) {
      body += `<tr><td class="drug">${esc(v.label)}<small>${esc(v.unit)}</small></td>${g.buckets.map((b) => {
        const c = v.cells[b];
        const now = b === nowBucket ? "now" : "";
        if (!c) return `<td class="${now}"></td>`;
        const tip = `${v.label}: median ${vfmt(v.vital, c.median)}, range ${vfmt(v.vital, c.min)}–${vfmt(v.vital, c.max)} ${v.unit}, ${c.n} reading${c.n === 1 ? "" : "s"} · click for details`;
        const sel = state.sel && state.sel.vital === v.vital && state.sel.bucket === b ? " sel" : "";
        return `<td class="${now} vt${sel}" tabindex="0" role="button" data-vital="${v.vital}" data-bucket="${b}" title="${esc(tip)}">${vfmt(v.vital, c.median)}</td>`;
      }).join("")}<td></td></tr>`;
    }
  }
  for (const r of g.rows) {
    if (r.category !== cat) {
      cat = r.category;
      body += `<tr class="cat"><td class="drug">${esc(cat)}</td><td colspan="${g.buckets.length + 1}"></td></tr>`;
    }
    const vals = g.buckets.map((b) => r.cells[b]?.amount ?? 0);
    const max = Math.max(...vals);
    const total = vals.reduce((a, b) => a + b, 0);
    body += `<tr><td class="drug">${r.continuous ? '<span class="dot" title="continuous infusion"></span>' : ""}${esc(r.label)}<small>${esc(r.unit)}</small></td>${
      g.buckets.map((b, i) => {
        const c = r.cells[b];
        const cls = [b === nowBucket ? "now" : "", c ? "v" : "", c && vals[i] >= max * 0.66 ? "hi" : ""].join(" ");
        if (!c) return `<td class="${cls}"></td>`;
        const tip = `${r.label}: ${fmt(c.amount)} ${r.unit}${c.max_rate != null ? ` · max rate ${fmt(c.max_rate)} ${c.rate_unit}` : ""} · click for details`;
        const sel = state.sel && !state.sel.vital && state.sel.itemid === r.itemid && state.sel.bucket === b ? " sel" : "";
        return `<td class="${cls}${sel}" tabindex="0" role="button" data-item="${r.itemid}" data-bucket="${b}" title="${esc(tip)}">${fmt(c.amount)}</td>`;
      }).join("")}<td><b>${fmt(total)}</b></td></tr>`;
  }
  if (!g.rows.length && !g.vitals.length) body = `<tr><td class="drug empty" colspan="${g.buckets.length + 2}">Nothing charted in this window.</td></tr>`;
  $("#grid").innerHTML = head + `<tbody>${body}</tbody>`;
  const wrap = $("#gridwrap");
  wrap.scrollLeft = wrap.scrollWidth;
}

function flagCard(f) {
  const act = f.status === "do_not_infuse" ? (f.hypothetical ? "Do not start" : "Hold") :
              f.status === "review" ? "Review" : "Cannot check";
  const ev = f.evidence.map((e) => esc(e.detail)).join(" · ");
  return `<div class="flag ${f.status}"><div class="h">${act}: ${esc(f.drug)}</div>
    <div>${esc(f.message)}</div><div class="e">${ev} · <code>${esc(f.rule_id)}</code></div></div>`;
}

function renderSafety(s) {
  const clock = String(s.as_of).replace("T", " ").slice(0, 16);
  const list = (fs, empty) => fs.length ? fs.map(flagCard).join("") : `<p class="empty">${empty}</p>`;
  $("#safety").innerHTML = `
    <h2>AI summary · ${clock}</h2>
    <div class="ai" id="ai">Summarizing…</div><div class="ai-meta" id="ai-meta"></div>
    <h2>Running or ordered now</h2>${list(s.flags, "No rule flags on running infusions.")}
    <h2>Do not start</h2>${list(s.blocked, "Nothing in the rule table is blocked right now.")}
    <h2>Running at ${clock.slice(11)}</h2>
    <ul class="plain">${s.running.map((r) => `<li><span>${esc(r.drug)}</span><span class="muted">${
      r.rate ? `${fmt(r.rate.value)} ${esc(r.rate.unit)}` : ""}</span></li>`).join("") || '<li class="empty">None</li>'}</ul>
    <h2>Latest vitals (charted by ${clock.slice(11)})</h2>
    <ul class="plain">${s.vitals.map((v) => `<li><span>${esc(v.name)}</span><span>${vfmt(v.vital, v.value)} ${esc(v.unit)}
      <span class="muted">${String(v.charttime).slice(11, 16)}</span></span></li>`).join("") || '<li class="empty">None in 24 h</li>'}</ul>
    <h2>Latest labs (available by ${clock.slice(11)})</h2>
    <ul class="plain">${s.labs.map((l) => `<li><span>${esc(l.label)}</span><span>${l.valuenum} ${esc(l.valueuom ?? "")}
      <span class="muted">${String(l.charttime).slice(5, 16).replace("T", " ")}</span></span></li>`).join("") || '<li class="empty">None in 48 h</li>'}</ul>
    <p class="prov">${esc(s.rules_version)} — ${esc(s.rules_provenance)}</p>`;
}

function renderSummary(ai) {
  const box = $("#ai");
  if (!box) return;
  box.textContent = ai.text;
  $("#ai-meta").textContent = ai.source === "llm"
    ? `Local model ${ai.model} · checked against the rule flags above`
    : ai.error ? `Rule text shown (${ai.error})` : "From the rule engine";
}

const DUR = { hour: 3600e3, day: 86400e3, week: 7 * 86400e3 };
const when = (s) => { const d = parse(String(s)); return `${d.getUTCMonth() + 1}/${d.getUTCDate()} ${String(d.getUTCHours()).padStart(2, "0")}:${String(d.getUTCMinutes()).padStart(2, "0")}`; };
const span = (a, b) => { const m = Math.round((parse(String(b)) - parse(String(a))) / 60e3); return m < 60 ? `${m} min` : `${(m / 60).toFixed(m % 60 ? 1 : 0)} h`; };

function markSelected(sel) {
  state.sel = sel;
  document.querySelectorAll("td.sel").forEach((el) => el.classList.remove("sel"));
  const q = sel.series != null ? `td.vt[data-key="${CSS.escape(sel.series)}"]` : sel.vital ? `td.vt[data-vital="${sel.vital}"]` : `td.v[data-item="${sel.itemid}"]`;
  document.querySelector(`${q}[data-bucket="${sel.bucket}"]`)?.classList.add("sel");
}

async function openVital(vital, bucket) {
  markSelected({ vital, bucket });
  const dlg = $("#detail");
  dlg.innerHTML = `<div class="d-body"><p class="empty">Loading…</p></div>`;
  if (!dlg.open) dlg.showModal();
  const q = new URLSearchParams({ vital, bucket, grain: state.grain, as_of: iso(state.clock) });
  const d = await api(`/api/stays/${state.stay.stay_id}/vitals/cell?${q}`);
  const vals = d.readings.map((r) => r.value).sort((a, b) => a - b);
  const median = vals.length ? (vals.length % 2 ? vals[(vals.length - 1) / 2] : (vals[vals.length / 2 - 1] + vals[vals.length / 2]) / 2) : null;
  const end = new Date(+parse(bucket) + DUR[state.grain]).toISOString();
  const label = state.grain === "hour" ? `${when(bucket)} – ${when(end).slice(-5)}` : `${when(bucket).slice(0, -6)} – ${when(new Date(+parse(end) - 1).toISOString()).slice(0, -6)}`;
  const rows = d.readings.map((r) => {
    const late = r.storetime ? Math.round((parse(String(r.storetime)) - parse(String(r.charttime))) / 60e3) : null;
    return `<tr><td class="l">${when(r.charttime)}</td><td><b>${vfmt(vital, r.value)}</b></td><td class="l">${esc(r.label)}</td>
      <td class="l muted">${late != null ? `${late} min later` : "not yet charted"}</td></tr>`;
  }).join("");
  dlg.innerHTML = `
    <div class="d-head">
      <div class="row" style="margin-top:0"><span class="muted">Vital signs</span><button id="d-close" aria-label="Close">✕</button></div>
      <h3 id="d-title">${esc(d.label)}</h3>
      <div class="muted">${label}</div>
      <div class="row"><span class="d-total">${vfmt(vital, median)} <span class="muted" style="font-size:14px">${esc(d.unit)} median</span></span>
        <button id="d-jump" title="Move the pump clock to the end of this ${state.grain}">Set pump clock here</button></div>
      <div class="muted" style="font-size:12px">${vals.length} reading${vals.length === 1 ? "" : "s"}${vals.length ? ` · range ${vfmt(vital, vals[0])}–${vfmt(vital, vals[vals.length - 1])}` : ""}</div>
    </div>
    <div class="d-body"><table class="readings"><thead><tr><th class="l">Time</th><th>Value</th><th class="l">Source</th><th class="l">Charted</th></tr></thead>
      <tbody>${rows || '<tr><td class="l empty" colspan="4">No readings.</td></tr>'}</tbody></table></div>`;
  $("#d-close").onclick = () => dlg.close();
  $("#d-jump").onclick = () => { dlg.close(); setClock(parse(end)); };
}

async function openCell(itemid, bucket) {
  markSelected({ itemid, bucket });
  const dlg = $("#detail");
  dlg.innerHTML = `<div class="d-body"><p class="empty">Loading…</p></div>`;
  if (!dlg.open) dlg.showModal();
  const q = new URLSearchParams({ itemid, bucket, grain: state.grain, as_of: iso(state.clock) });
  const d = await api(`/api/stays/${state.stay.stay_id}/cell?${q}`);
  const end = d.bucket_end ?? new Date(+parse(bucket) + DUR[state.grain]).toISOString();
  const label = state.grain === "hour" ? `${when(bucket)} – ${when(end).slice(-5)}` : `${when(bucket).slice(0, -6)} – ${when(new Date(+parse(String(end)) - 1).toISOString()).slice(0, -6)}`;
  const cards = d.events.map((e) => {
    const pct = e.amount ? Math.min(100, (100 * e.in_bucket) / e.amount) : 0;
    const bag = e.bag.length ? e.bag.map((b) => `${esc(b.label)}${b.amount != null ? ` ${fmt(b.amount)} ${esc(b.unit)}` : ""}${b.rate != null ? ` @ ${fmt(b.rate)} ${esc(b.rate_unit)}` : ""}`).join("<br>") : "";
    const late = e.charted_at ? Math.round((parse(String(e.charted_at)) - parse(String(e.start))) / 60e3) : null;
    return `<div class="ev">
      <div class="ev-time">${when(e.start)} → ${e.running ? `running <span class="muted">(${span(e.start, d.as_of)} so far)</span>` : `${when(e.end)} <span class="muted">(${span(e.start, e.end)})</span>`}
        <span class="tag">${esc(e.status)}</span></div>
      <dl>
        <dt>In this ${state.grain}</dt><dd><b>${fmt(e.in_bucket)} ${esc(e.unit)}</b> <span class="muted">of ${fmt(e.amount)} ${esc(e.unit)} ${e.running ? "delivered so far" : "charted"} (${pct.toFixed(0)}%)</span></dd>
        <dt>Rate</dt><dd>${e.rate != null ? `${fmt(e.rate)} ${esc(e.rate_unit)}` : '<span class="muted">none charted (bolus or additive)</span>'}</dd>
        <dt>Type</dt><dd>${esc(e.kind)}${e.component ? ` · ${esc(e.component)}` : ""}</dd>
        ${bag ? `<dt>Same bag</dt><dd>${bag}</dd>` : ""}
        <dt>Order</dt><dd>#${esc(e.order)}</dd>
        ${e.weight_kg ? `<dt>Weight</dt><dd>${fmt(e.weight_kg)} kg</dd>` : ""}
        ${late != null ? `<dt>Charted</dt><dd>${when(e.charted_at)} <span class="muted">(${late >= 0 ? `${late} min after start` : `${-late} min before start`})</span></dd>` : ""}
      </dl>
      <div class="share" title="Share of this event delivered in this ${state.grain}"><span style="width:${pct}%"></span></div>
    </div>`;
  }).join("") || `<p class="empty">No charted events in this ${state.grain}.</p>`;
  dlg.innerHTML = `
    <div class="d-head">
      <div class="row" style="margin-top:0"><span class="muted">${esc(d.category ?? "")}</span><button id="d-close" aria-label="Close">✕</button></div>
      <h3 id="d-title">${esc(d.label)}</h3>
      <div class="muted">${label}</div>
      <div class="row"><span class="d-total">${fmt(d.total)} <span class="muted" style="font-size:14px">${esc(d.unit ?? "")}</span></span>
        <button id="d-jump" title="Move the pump clock to the end of this ${state.grain}">Set pump clock here</button></div>
      <div class="muted" style="font-size:12px">${d.events.length} charted event${d.events.length === 1 ? "" : "s"} · shares sum to the cell value</div>
    </div>
    <div class="d-body">${cards}</div>`;
  $("#d-close").onclick = () => dlg.close();
  $("#d-jump").onclick = () => { dlg.close(); setClock(parse(String(end))); };
}

$("#grid").addEventListener("click", (e) => {
  const td = e.target.closest("td.v, td.vt");
  if (!td) return;
  if (td.dataset.key != null) return openSeriesCell(td.dataset.key, td.dataset.bucket);
  td.dataset.vital ? openVital(td.dataset.vital, td.dataset.bucket) : openCell(+td.dataset.item, td.dataset.bucket);
});
$("#grid").addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("td.v, td.vt")) { e.preventDefault(); e.target.click(); } });
$("#detail").addEventListener("click", (e) => { if (e.target.id === "detail") e.target.close(); });

$("#stays").addEventListener("click", (e) => { const el = e.target.closest(".stay"); if (el) selectStay(+el.dataset.id); });
let debounce;
$("#q").addEventListener("input", (e) => { clearTimeout(debounce); debounce = setTimeout(() => loadStays(e.target.value.trim()), 250); });
document.querySelectorAll("#datatabs button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll("#datatabs button").forEach((x) => x.classList.toggle("on", x === b));
  state.tab = b.dataset.tab; state.sel = null; state.filter = "";
  history.replaceState(null, "", `?stay=${state.stay.stay_id}&tab=${state.tab}`);
  refresh();
}));
document.querySelectorAll("#grains button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll("#grains button").forEach((x) => x.classList.toggle("on", x === b));
  state.grain = b.dataset.grain; state.sel = null; refresh();
}));
$("#back").onclick = () => setClock(new Date(+state.clock - 3600e3));
$("#fwd").onclick = () => setClock(new Date(+state.clock + 3600e3));
$("#clock").onchange = (e) => e.target.value && setClock(parse(e.target.value));
$("#play").onclick = () => {
  if (state.timer) { clearInterval(state.timer); state.timer = null; $("#play").textContent = "▶ Replay"; return; }
  $("#play").textContent = "❚❚ Pause";
  state.timer = setInterval(() => {
    if (+state.clock >= +parse(state.stay.outtime)) return $("#play").click();
    setClock(new Date(+state.clock + 3600e3));
  }, 2000);
};

const initial = new URLSearchParams(location.search).get("stay");
const initialTab = new URLSearchParams(location.search).get("tab");
if (initialTab && document.querySelector(`#datatabs [data-tab="${initialTab}"]`)) {
  state.tab = initialTab;
  document.querySelectorAll("#datatabs button").forEach((x) => x.classList.toggle("on", x.dataset.tab === initialTab));
}
loadStays().then(() => initial && selectStay(+initial));
</script>
</body>
</html>
